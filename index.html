<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Kalkulator</h1>

    <p id="display-angka"></p>
    <p id="display-op"></p>

    <div class="row">
        <button class="normal btnNumber">7</button>
        <button class="normal btnNumber">8</button>
        <button class="normal btnNumber">9</button>
        <button class="normal btnOperator">÷</button>
    </div>
    <div class="row">
        <button class="normal btnNumber">4</button>
        <button class="normal btnNumber">5</button>
        <button class="normal btnNumber">6</button>
        <button class="normal btnOperator">×</button>
    </div>
    <div class="row">
        <button class="normal btnNumber">1</button>
        <button class="normal btnNumber">2</button>
        <button class="normal btnNumber">3</button>
        <button class="normal btnOperator">+</button>
    </div>
    <div class="row">
        <button class="equal" id="btnHasil"> = </button>
        <button class="normal btnNumber">0</button>
        <button class="erase btnOperator" id="btnHapus">&#9003</button>
        <button class="minus btnOperator">-</button>
    </div>
    <div class="row">
        <button class="clear" id="clear">C</button>
    </div>
</body>
</html>
